name: Continuous Deployment (CD)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      deploy_target:
        description: 'Component to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend
      run_migrations:
        description: 'Run Django database migrations'
        required: false
        default: true
        type: boolean

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  deployments: write

env:
  REGISTRY: ghcr.io

jobs:
  # ===========================================================================
  # 1. Build & Push Docker Images to GHCR
  # ===========================================================================
  build-and-push:
    name: Build & Push Container Images
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.image_names.outputs.backend_image }}
      frontend_image: ${{ steps.image_names.outputs.frontend_image }}
      image_tag: ${{ steps.image_names.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Image Tags & Metadata
        id: image_names
        run: |
          LOWER_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BACKEND_NAME="${{ env.REGISTRY }}/${LOWER_OWNER}/prex-backend"
          FRONTEND_NAME="${{ env.REGISTRY }}/${LOWER_OWNER}/prex-frontend"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          
          TAG="sha-${SHORT_SHA}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          
          echo "backend_image=${BACKEND_NAME}:${TAG}" >> $GITHUB_OUTPUT
          echo "frontend_image=${FRONTEND_NAME}:${TAG}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "owner=${LOWER_OWNER}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata (Backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_names.outputs.owner }}/prex-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.image_names.outputs.tag }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Backend image
        if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'backend' || inputs.deploy_target == null }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Extract Docker metadata (Frontend)
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_names.outputs.owner }}/prex-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.image_names.outputs.tag }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Frontend image
        if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'frontend' || inputs.deploy_target == null }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=/api/v1
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ===========================================================================
  # 2. Deploy to Remote Server via SSH
  # ===========================================================================
  deploy:
    name: Deploy to Server (${{ inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ vars.APP_URL || 'https://prex.duckdns.org' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Remote Host via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/prex' }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations != false }}
          DEPLOY_TARGET: ${{ inputs.deploy_target || 'all' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: REGISTRY,REGISTRY_USER,REGISTRY_PASSWORD,BACKEND_IMAGE,FRONTEND_IMAGE,DEPLOY_PATH,RUN_MIGRATIONS,DEPLOY_TARGET
          script_stop: true
          script: |
            set -eo pipefail
            echo "========================================================="
            echo "🚀 Starting PREX Continuous Deployment"
            echo "Target Directory: ${DEPLOY_PATH}"
            echo "Backend Image:    ${BACKEND_IMAGE}"
            echo "Frontend Image:   ${FRONTEND_IMAGE}"
            echo "========================================================="

            # Ensure deployment directory exists
            mkdir -p "${DEPLOY_PATH}"
            cd "${DEPLOY_PATH}"

            # Log in to GitHub Container Registry on the remote server
            echo "🔑 Authenticating to container registry ${REGISTRY}..."
            echo "${REGISTRY_PASSWORD}" | docker login "${REGISTRY}" -u "${REGISTRY_USER}" --password-stdin

            # Export deployment variables
            export BACKEND_IMAGE="${BACKEND_IMAGE}"
            export FRONTEND_IMAGE="${FRONTEND_IMAGE}"

            # Verify environment configuration file exists
            if [ ! -f .env.docker ] && [ ! -f .env ]; then
              echo "⚠️ WARNING: .env.docker not found in ${DEPLOY_PATH}."
              if [ -f .env.docker.example ]; then
                echo "📋 Creating .env.docker from template..."
                cp .env.docker.example .env.docker
              else
                echo "❌ Deployment halted: Please create ${DEPLOY_PATH}/.env.docker with production secrets."
                exit 1
              fi
            fi

            # Record current active tags for rollback support
            if [ -f .last_deploy_state ]; then
              cp .last_deploy_state .rollback_state
            fi
            echo "BACKEND_IMAGE=${BACKEND_IMAGE}" > .last_deploy_state
            echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> .last_deploy_state

            # Pull updated container images
            echo "📥 Pulling new container images..."
            docker compose -f docker-compose.prod.yml pull backend frontend celery_worker celery_beat || true

            # Ensure database and redis dependencies are healthy
            echo "🐘 Ensuring PostgreSQL and Redis services are up and healthy..."
            docker compose -f docker-compose.prod.yml up -d db redis

            # Wait for database readiness
            echo "⏳ Waiting for database health check..."
            timeout 45s bash -c 'until docker compose -f docker-compose.prod.yml exec -T db pg_isready; do sleep 2; done' || true

            # Run Django migrations and static collection if enabled
            if [ "${RUN_MIGRATIONS}" = "true" ]; then
              echo "🔄 Running database migrations..."
              docker compose -f docker-compose.prod.yml run --rm backend python manage.py migrate --noinput

              echo "📦 Collecting static files..."
              docker compose -f docker-compose.prod.yml run --rm backend python manage.py collectstatic --noinput
            fi

            # Recreate containers with zero downtime / rolling update
            echo "🔄 Deploying updated application services..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Perform Post-Deployment Smoke Test & Health Check
            echo "🩺 Running health check validation..."
            HEALTHY=0
            for i in $(seq 1 30); do
              sleep 2
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/v1/health/ || curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/api/v1/health/ || true)
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "✅ Health check passed on attempt $i (HTTP 200 OK)"
                HEALTHY=1
                break
              else
                echo "⏳ Attempt $i: API returned status $HTTP_STATUS, retrying..."
              fi
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "❌ Health check failed after 30 attempts! Initiating automatic rollback..."
              if [ -f .rollback_state ]; then
                source .rollback_state
                export BACKEND_IMAGE FRONTEND_IMAGE
                docker compose -f docker-compose.prod.yml up -d
                echo "⚠️ Stack rolled back to previous state (${BACKEND_IMAGE})."
              fi
              echo "Recent container logs:"
              docker compose -f docker-compose.prod.yml logs --tail 50 backend frontend
              exit 1
            fi

            # Clean up dangling images to conserve server storage
            echo "🧹 Cleaning up obsolete Docker images..."
            docker image prune -f

            echo "========================================================="
            echo "🎉 PREX Deployment Successfully Completed!"
            echo "========================================================="

  # ===========================================================================
  # 3. Deployment Status & Summary
  # ===========================================================================
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always()

    steps:
      - name: Generate GitHub Actions Summary
        run: |
          STATUS="✅ Success"
          if [ "${{ needs.deploy.result }}" != "success" ]; then
            STATUS="❌ Failed (${{ needs.deploy.result }})"
          fi

          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🚀 PREX Deployment Summary

          | Attribute | Value |
          | :--- | :--- |
          | **Status** | ${STATUS} |
          | **Environment** | \`${{ inputs.environment || 'production' }}\` |
          | **Triggered By** | @${{ github.actor }} |
          | **Git Commit** | [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | **Git Ref / Branch** | \`${{ github.ref }}\` |
          | **Backend Image** | \`${{ needs.build-and-push.outputs.backend_image || 'N/A' }}\` |
          | **Frontend Image** | \`${{ needs.build-and-push.outputs.frontend_image || 'N/A' }}\` |
          | **Build & Push** | ${{ needs.build-and-push.result }} |
          | **Deploy Execution** | ${{ needs.deploy.result }} |

          ### 🔗 Endpoints & Verification
          - **Public Web Application:** ${{ vars.APP_URL || 'https://prex.duckdns.org' }}
          - **API Health Status:** \`/api/v1/health/\`
          - **Nginx Liveness Probe:** \`/healthz\`
          - **OpenAPI Schema:** \`/api/v1/docs/\`
          EOF
