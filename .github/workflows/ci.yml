name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - master
      - dev
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ===========================================================================
  # 1. Backend CI (Checks, Migrations & Unit Tests)
  # ===========================================================================
  backend:
    name: Backend CI (Tests & Checks)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prex
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: prex.settings.local
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-test-secret-key-for-django-build-validation-32chars' }}
      DB_NAME: prex
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      EMAIL_VERIFICATION_URL: http://localhost:5173/verify-email
      EMAIL_VERIFICATION_SUCCESS_URL: http://localhost:5173/login
      PASSWORD_RESET_URL: http://localhost:5173/reset-password-confirm
      COINGECKO_API_KEY: dummy-api-key-for-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: |
          cd backend
          python manage.py check

      - name: Check for missing migrations
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: |
          cd backend
          python manage.py test

  # ===========================================================================
  # 2. Frontend CI (ESLint & Vite Production Build)
  # ===========================================================================
  frontend:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend bundle
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

  # ===========================================================================
  # 3. Publish Multi-Arch Docker Images to GHCR (On push to main / tags)
  # Allows pulling pre-built ARM64/AMD64 images directly inside your Oracle VM
  # ===========================================================================
  publish-images:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Image Names & Metadata
        id: meta
        run: |
          LOWER_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "owner=${LOWER_OWNER}" >> $GITHUB_OUTPUT
          echo "sha_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata (Backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/prex-backend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.meta.outputs.sha_tag }}
            type=ref,event=tag

      - name: Build & Push Backend Multi-Arch Image (ARM64 & AMD64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Extract Docker metadata (Frontend)
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/prex-frontend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.meta.outputs.sha_tag }}
            type=ref,event=tag

      - name: Build & Push Frontend Multi-Arch Image (ARM64 & AMD64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/arm64,linux/amd64
          build-args: |
            VITE_API_BASE_URL=/api/v1
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend