# =============================================================================
# PREX Production Docker Compose Configuration
# =============================================================================
# Production-hardened multi-container deployment:
# - Disables public host port exposure for PostgreSQL (5432) and Redis (6379)
# - Removes live-code volume mounts (./backend:/app) to ensure immutability
# - Runs production WSGI server (Gunicorn) with multi-worker concurrency
# - Uses production environment configuration
#
# Usage:
#   docker compose -f docker-compose.prod.yml up --build -d
# =============================================================================

services:
  # =========================================================================
  # 1. PostgreSQL Database Service (Internal Network Only)
  # =========================================================================
  db:
    image: postgres:17-alpine
    container_name: prex_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-prex}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-prex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. Redis Cache & Broker Service (Internal Network Only)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: prex_redis_prod
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # =========================================================================
  # 3. Django Web API Backend Service (Gunicorn WSGI)
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: prex_backend_prod
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn prex.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================================================================
  # 4. Celery Asynchronous Task Worker Service
  # =========================================================================
  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: prex_celery_worker_prod
    restart: always
    command: celery -A prex worker --loglevel=info
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================================================================
  # 5. Celery Beat Periodic Task Scheduler Service
  # =========================================================================
  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: prex_celery_beat_prod
    restart: always
    command: celery -A prex beat --loglevel=info
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================================================================
  # 6. React Frontend & Nginx Reverse Proxy Service
  # =========================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: prex_frontend_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

# =============================================================================
# Persistent Storage Volumes
# =============================================================================
volumes:
  postgres_data:
