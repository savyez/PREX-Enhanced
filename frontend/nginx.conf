# =============================================================================
# PREX Nginx Reverse Proxy & Static Asset Server Configuration
# =============================================================================
# Acts as the reverse proxy in front of Gunicorn WSGI and serves React SPA:
# - Buffers slow clients to prevent DoS/Slowloris attacks against Gunicorn
# - Provides gzip compression, client body limits, and connection timeouts
# - Forwards client headers (real IP, host, proto) to Django
# - Handles SPA client-side routing fallback to index.html
# =============================================================================

upstream django_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Maximum allowed client request body size
    client_max_body_size 10M;

    # Client connection & request timeouts (slow-client mitigation)
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 15s;

    # Gzip compression for static assets and JSON responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # 1. API & Admin Reverse Proxy to Gunicorn
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;

        # Header forwarding
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        # Buffer configuration to insulate Gunicorn from slow clients
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;

        # Upstream proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # 2. Static Asset Caching
    # -------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # 3. SPA Client-Side Routing Fallback
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check passthrough
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
