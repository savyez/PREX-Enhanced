# =============================================================================
# PREX Nginx TLS/SSL Termination & Reverse Proxy Configuration
# =============================================================================
# Production configuration with HTTPS termination:
# - Automatically redirects all HTTP (80) traffic to HTTPS (443)
# - Enforces modern TLS protocols (TLSv1.2, TLSv1.3) and secure ciphers
# - Full reverse-proxy buffering to isolate Gunicorn from slow clients
# - Gzip compression and static asset caching
#
# Mount your SSL certificate and private key to:
#   /etc/nginx/ssl/live/fullchain.pem
#   /etc/nginx/ssl/live/privkey.pem
# =============================================================================

upstream django_backend {
    server backend:8000;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# HTTP Server (Redirect to HTTPS)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name prex.duckdns.org;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS Server (SSL Termination & Reverse Proxy)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prex.duckdns.org;

    root /usr/share/nginx/html;
    index index.html;

    # SSL Certificates
    ssl_certificate /etc/nginx/ssl/live/prex.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/prex.duckdns.org/privkey.pem;
   
    # Modern TLS protocols and ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session parameters
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Maximum client payload size
    client_max_body_size 10M;

    # Slow client protection timeouts
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 15s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers (including HSTS)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # 1. API & Admin Reverse Proxy to Gunicorn
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        # Buffer slow clients
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # 2. Static Asset Caching
    # -------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # 3. SPA Client-Side Routing Fallback
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check passthrough
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
